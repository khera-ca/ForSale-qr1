<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanjeev Khera | Property Access</title>
  <style>
    :root{
      --navy:#0f2747;
      --red:#d2232a;
      --gold:#c8a96b;
      --ink:#1f2937;
      --muted:#6b7280;
      --bg:#f7f4ef;
      --card:#ffffff;
      --line:#e5dfd3;
      --ok:#0f766e;
      --shadow:0 20px 50px rgba(15,39,71,.12);
      --radius:20px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(180deg,#f8f4ee 0%,#f5efe7 100%);
      color:var(--ink);
    }
    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:24px;
    }
    .hero{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:24px;
      align-items:stretch;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .brand{
      padding:28px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      min-height:100%;
    }
    .badge{
      display:inline-block;
      padding:8px 12px;
      border-radius:999px;
      background:#f3ede3;
      color:var(--navy);
      font-size:12px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:14px;
    }
    h1{
      margin:0 0 12px;
      font-size:42px;
      line-height:1.06;
      color:var(--navy);
    }
    .sub{
      font-size:18px;
      line-height:1.6;
      color:#495466;
      max-width:54ch;
      margin-bottom:22px;
    }
    .logos{
      display:flex;
      gap:16px;
      align-items:center;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .logos img{
      max-height:72px;
      width:auto;
      display:block;
      border-radius:10px;
      background:#fff;
      padding:4px;
    }
    .agent{
      display:flex;
      align-items:center;
      gap:16px;
      margin-top:24px;
      padding-top:20px;
      border-top:1px solid var(--line);
    }
    .agent img{
      width:96px;
      height:96px;
      border-radius:18px;
      object-fit:cover;
      border:1px solid var(--line);
      background:#fff;
    }
    .agent .meta strong{
      display:block;
      font-size:20px;
      color:var(--navy);
    }
    .agent .meta span{
      display:block;
      color:var(--muted);
      margin-top:4px;
      line-height:1.45;
    }
    .formCard{
      padding:28px;
    }
    .formTitle{
      margin:0 0 8px;
      font-size:28px;
      color:var(--navy);
    }
    .formText{
      margin:0 0 20px;
      color:var(--muted);
      line-height:1.6;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    .field{
      margin-bottom:14px;
    }
    .full{
      grid-column:1 / -1;
    }
    label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-bottom:8px;
      color:var(--ink);
    }
    input{
      width:100%;
      padding:14px 14px;
      border:1px solid #d9d2c5;
      border-radius:14px;
      font-size:16px;
      background:#fff;
      outline:none;
    }
    input:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 4px rgba(200,169,107,.15);
    }
    .radioWrap{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .radioPill{
      flex:1 1 160px;
      border:1px solid #d9d2c5;
      border-radius:14px;
      padding:12px 14px;
      display:flex;
      align-items:center;
      gap:10px;
      background:#fff;
      cursor:pointer;
    }
    .radioPill input{
      width:auto;
      margin:0;
    }
    .helper{
      font-size:13px;
      color:var(--muted);
      margin-top:4px;
      line-height:1.5;
    }
    .consent{
      margin:12px 0 18px;
      padding:14px 16px;
      background:#faf6ef;
      border:1px solid #eadfcf;
      border-radius:14px;
      font-size:13px;
      line-height:1.6;
      color:#5a5143;
    }
    .btn{
      width:100%;
      border:none;
      border-radius:16px;
      padding:16px 18px;
      font-size:16px;
      font-weight:800;
      background:var(--navy);
      color:#fff;
      cursor:pointer;
      transition:.2s ease;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{
      cursor:not-allowed;
      opacity:.55;
      transform:none;
    }
    .note{
      margin-top:12px;
      font-size:12px;
      text-align:center;
      color:var(--muted);
      line-height:1.5;
    }
    .thankyou{
      display:none;
      text-align:center;
      padding:42px 20px;
    }
    .thankyou h2{
      margin:0 0 10px;
      color:var(--ok);
      font-size:30px;
    }
    .thankyou p{
      margin:0;
      color:var(--muted);
      font-size:17px;
    }
    @media (max-width: 860px){
      .hero{grid-template-columns:1fr}
      h1{font-size:34px}
